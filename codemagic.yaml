# Kharcha — Codemagic CI
# First Android release-APK verification build. The Expo/React Native project
# is at the repository root, so every command runs from the repo root.
# Gradle uses the template debug keystore until production signing is added.

workflows:
  kharcha-android-apk:
    name: Kharcha Android APK
    max_build_duration: 120
    environment:
      node: 24.19.0
    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          npm ci
      - name: Run Jest test suite
        script: |
          set -e
          npx jest --silent
      - name: Generate Android project with Expo prebuild
        script: |
          set -e
          npx expo prebuild --platform android --clean
      - name: Build Android release APK
        script: |
          set -e
          chmod +x android/gradlew
          java -version
          ./android/gradlew -p android assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
